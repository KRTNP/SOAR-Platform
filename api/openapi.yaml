openapi: 3.1.0
info:
  title: KRTN SOAR API
  version: 1.0.0
  description: REST contract for the single-tenant SOAR lab.
servers:
  - url: https://soar.lab.local
security:
  - oidc: []
paths:
  /healthz:
    get:
      security: []
      operationId: getHealth
      responses:
        '200':
          description: Process is alive.
  /readyz:
    get:
      security: []
      operationId: getReadiness
      responses:
        '200':
          description: Dependencies are ready.
        '503':
          description: One or more dependencies are unavailable.
  /v1/events:
    get:
      operationId: listEvents
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Scoped events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourcePage'
    post:
      operationId: ingestEvent
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventIngestRequest'
      responses:
        '202':
          description: Event accepted for processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedEvent'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /v1/cases:
    get:
      operationId: listCases
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Scoped cases.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CasePage'
    post:
      operationId: createCase
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCaseRequest'
      responses:
        '201':
          description: Case created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Case'
        '400':
          $ref: '#/components/responses/Problem'
  /v1/cases/{caseId}:
    get:
      operationId: getCase
      parameters:
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200':
          description: Case.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Case'
        '404':
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateCase
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseUpdateRequest'
      responses:
        '200':
          description: Case updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Case'
        '409':
          $ref: '#/components/responses/Problem'
  /v1/cases/{caseId}/timeline:
    get:
      operationId: getCaseTimeline
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Case timeline.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourcePage'
  /v1/cases/{caseId}/evidence:
    get:
      operationId: listCaseEvidence
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Case evidence references.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourcePage'
  /v1/cases/{caseId}/tasks:
    get:
      operationId: listCaseTasks
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Analyst tasks for the case.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourcePage'
    post:
      operationId: createCaseTask
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseTaskRequest'
      responses:
        '201':
          description: Analyst task created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '409':
          $ref: '#/components/responses/Problem'
  /v1/cases/{caseId}/export:
    post:
      operationId: exportCase
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseExportRequest'
      responses:
        '202':
          description: Redacted case manifest export accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseExportAccepted'
        '409':
          $ref: '#/components/responses/Problem'
  /v1/alerts:
    get:
      operationId: listAlerts
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Scoped alerts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourcePage'
  /v1/alerts/{alertId}/triage:
    post:
      operationId: triageAlert
      parameters:
        - $ref: '#/components/parameters/AlertId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Triage recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '409':
          $ref: '#/components/responses/Problem'
  /v1/observables:
    get:
      operationId: listObservables
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Scoped observables.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourcePage'
    post:
      operationId: createObservable
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, value]
              properties:
                kind: {type: string}
                value: {type: string}
                source: {type: string}
      responses:
        '201':
          description: Observable recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '409':
          $ref: '#/components/responses/Problem'
  /v1/schedules:
    get:
      operationId: listSchedules
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Scoped playbook schedules.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourcePage'
    post:
      operationId: createSchedule
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleRequest'
      responses:
        '201':
          description: Schedule created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
        '409':
          $ref: '#/components/responses/Problem'
  /v1/schedules/{scheduleId}:
    patch:
      operationId: updateSchedule
      parameters:
        - $ref: '#/components/parameters/ScheduleId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleRequest'
      responses:
        '200':
          description: Schedule updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
    delete:
      operationId: deleteSchedule
      parameters:
        - $ref: '#/components/parameters/ScheduleId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Schedule disabled and removed from future dispatch.
  /v1/playbooks:
    get:
      operationId: listPlaybooks
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Validated and draft playbooks in scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourcePage'
  /v1/playbooks/{playbookId}:
    get:
      operationId: getPlaybook
      parameters:
        - $ref: '#/components/parameters/PlaybookId'
      responses:
        '200':
          description: Playbook metadata and workflow.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          $ref: '#/components/responses/Problem'
  /v1/playbooks/{playbookId}/validate:
    post:
      operationId: validatePlaybook
      parameters:
        - $ref: '#/components/parameters/PlaybookId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Validation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
  /v1/playbooks/{playbookId}/promote:
    post:
      operationId: promotePlaybook
      parameters:
        - $ref: '#/components/parameters/PlaybookId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaybookPromotionRequest'
      responses:
        '200':
          description: Playbook promotion recorded after lifecycle checks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '409':
          $ref: '#/components/responses/Problem'
  /v1/executions:
    post:
      operationId: startExecution
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartExecutionRequest'
      responses:
        '202':
          description: Execution accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionAccepted'
        '403':
          $ref: '#/components/responses/Problem'
  /v1/executions/{executionId}:
    get:
      operationId: getExecution
      parameters:
        - $ref: '#/components/parameters/ExecutionId'
      responses:
        '200':
          description: Execution state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Execution'
  /v1/executions/{executionId}/pause:
    post:
      operationId: pauseExecution
      parameters:
        - $ref: '#/components/parameters/ExecutionId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Pause requested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Execution'
  /v1/executions/{executionId}/resume:
    post:
      operationId: resumeExecution
      parameters:
        - $ref: '#/components/parameters/ExecutionId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Resume requested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Execution'
  /v1/executions/{executionId}/cancel:
    post:
      operationId: cancelExecution
      parameters:
        - $ref: '#/components/parameters/ExecutionId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Cancel requested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Execution'
  /v1/executions/{executionId}/replay:
    post:
      operationId: replayExecution
      parameters:
        - $ref: '#/components/parameters/ExecutionId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Replay accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionAccepted'
  /v1/approvals/{approvalId}/approve:
    post:
      operationId: approveAction
      parameters:
        - $ref: '#/components/parameters/ApprovalId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Approval recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'
        '409':
          $ref: '#/components/responses/Problem'
  /v1/approvals:
    get:
      operationId: listApprovals
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Approvals visible to the principal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourcePage'
  /v1/approvals/{approvalId}/reject:
    post:
      operationId: rejectApproval
      parameters:
        - $ref: '#/components/parameters/ApprovalId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string}
      responses:
        '200':
          description: Rejection recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'
        '409':
          $ref: '#/components/responses/Problem'
  /v1/actions/{actionId}/execute:
    post:
      operationId: executeAction
      parameters:
        - $ref: '#/components/parameters/ActionId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Action submitted to workflow worker.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionAccepted'
        '403':
          $ref: '#/components/responses/Problem'
  /v1/actions/{actionId}/release:
    post:
      operationId: releaseAction
      parameters:
        - $ref: '#/components/parameters/ActionId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Action released (network/connector state rolled back). Idempotent if already released.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseAccepted'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /v1/actions/preview:
    post:
      operationId: previewAction
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [intent, target]
              properties:
                intent: {type: string}
                target: {type: string}
      responses:
        '200':
          description: Dry-run action preview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
  /v1/actions/{actionId}:
    get:
      operationId: getAction
      parameters:
        - $ref: '#/components/parameters/ActionId'
      responses:
        '200':
          description: Action state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Action'
  /v1/evidence/manifests:
    post:
      operationId: createEvidenceManifest
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvidenceManifestRequest'
      responses:
        '201':
          description: Evidence manifest created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evidence'
  /v1/evidence/{evidenceId}:
    get:
      operationId: getEvidence
      parameters:
        - $ref: '#/components/parameters/EvidenceId'
      responses:
        '200':
          description: Evidence metadata and custody references.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evidence'
  /v1/connectors:
    get:
      operationId: listConnectors
      responses:
        '200':
          description: Connector capabilities and health summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourcePage'
  /v1/connectors/{connectorId}/health:
    get:
      operationId: getConnectorHealth
      parameters:
        - $ref: '#/components/parameters/ConnectorId'
      responses:
        '200':
          description: Connector health.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
  /v1/connectors/{connectorId}/test:
    post:
      operationId: testConnector
      parameters:
        - $ref: '#/components/parameters/ConnectorId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Connector test result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
  /v1/audit:
    get:
      operationId: listAudit
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Restricted audit records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourcePage'
  /v1/allowlist:
    get:
      operationId: listTrustedSources
      responses:
        '200':
          description: >-
            Trusted/management sources that adr/0018's SSH brute-force
            auto-trigger must never request a block against.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourcePage'
    post:
      operationId: addTrustedSource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrustedSourceRequest'
      responses:
        '201':
          description: Trusted source added (or its reason/expiry updated, if the value already existed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustedSource'
  /v1/metrics:
    get:
      operationId: getMetrics
      responses:
        '200':
          description: >-
            A point-in-time snapshot of the KPIs this system can currently
            compute from its own recorded data (docs/07-operations/metrics-and-kpis.md);
            not a time series or a historical baseline. See adr/0015-kpi-snapshot.md
            for scope and disclosed gaps.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /v1/stream:
    get:
      operationId: streamEvents
      responses:
        '200':
          description: Server-sent event stream.
          content:
            text/event-stream:
              schema:
                type: string
components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://keycloak.lab.local/realms/soar/.well-known/openid-configuration
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    CaseId:
      name: caseId
      in: path
      required: true
      schema:
        type: string
    ExecutionId:
      name: executionId
      in: path
      required: true
      schema:
        type: string
    ApprovalId:
      name: approvalId
      in: path
      required: true
      schema:
        type: string
    ActionId:
      name: actionId
      in: path
      required: true
      schema:
        type: string
    AlertId:
      name: alertId
      in: path
      required: true
      schema:
        type: string
    PlaybookId:
      name: playbookId
      in: path
      required: true
      schema:
        type: string
    EvidenceId:
      name: evidenceId
      in: path
      required: true
      schema:
        type: string
    ConnectorId:
      name: connectorId
      in: path
      required: true
      schema:
        type: string
    ScheduleId:
      name: scheduleId
      in: path
      required: true
      schema:
        type: string
  responses:
    Problem:
      description: Stable API error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    ResourcePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {}
        next_cursor:
          type: string
          nullable: true
    CasePage:
      allOf:
        - $ref: '#/components/schemas/ResourcePage'
    StatusResponse:
      type: object
      required: [status]
      properties:
        status: {type: string}
        message: {type: string}
    PlaybookPromotionRequest:
      type: object
      required: [target_state, reviewer_ids]
      properties:
        target_state:
          type: string
          enum: [lab_tested, staged, approved, active]
        reviewer_ids:
          type: array
          minItems: 1
          items: {type: string}
        change_summary: {type: string}
    CaseUpdateRequest:
      type: object
      required: [operation]
      properties:
        operation:
          type: string
          enum: [update, transition, merge, split, close, open_ticket, request_block]
        title: {type: string}
        owner_id: {type: string}
        status:
          type: string
          enum: [new, triage, investigating, contained, eradication, recovery, escalated, dismissed, closed]
        target_case_id: {type: string}
        child_case_ids:
          type: array
          items: {type: string}
        closure_reason: {type: string}
        reason: {type: string}
        target_value: {type: string}
    CaseTaskRequest:
      type: object
      required: [title]
      properties:
        title: {type: string}
        assignee_id: {type: string}
        due_at: {type: string, format: date-time}
    CaseExportRequest:
      type: object
      required: [format]
      properties:
        format: {type: string, enum: [json, csv]}
        include_evidence_references: {type: boolean, default: true}
        redaction_profile: {type: string, enum: [standard, full], default: standard}
        purpose: {type: string}
        recipient: {type: string}
    CaseExportAccepted:
      type: object
      required: [export_id, status]
      properties:
        export_id: {type: string}
        status: {type: string, enum: [accepted, completed, failed]}
        manifest_sha256: {type: string}
        redaction_profile: {type: string}
        manifest:
          type: object
          additionalProperties: true
    EvidenceManifestRequest:
      type: object
      required: [case_id, artifact_type, uri, sha256, size, source, acquisition_method,
                 collector, collected_at, tool_name, tool_version, command_ref, analyst,
                 purpose, sensitivity, retention_class]
      properties:
        case_id: {type: string}
        artifact_type: {type: string}
        uri: {type: string}
        sha256: {type: string, pattern: '^[a-fA-F0-9]{64}$'}
        size: {type: integer, minimum: 0}
        source: {type: string}
        acquisition_method: {type: string}
        collector: {type: string}
        collected_at: {type: string, format: date-time}
        tool_name: {type: string}
        tool_version: {type: string}
        command_ref: {type: string}
        analyst: {type: string}
        purpose: {type: string}
        limitations: {type: array, items: {type: string}}
        derived_from: {type: array, items: {type: string}}
        sensitivity: {type: string, enum: [public, internal, confidential, restricted]}
        retention_class: {type: string}
    EvidenceCustodyEvent:
      type: object
      required: [event, actor, at]
      properties:
        event: {type: string}
        actor: {type: string}
        at: {type: string, format: date-time}
        from_hash: {type: string}
        to_hash: {type: string}
    Evidence:
      type: object
      required: [id, case_id, artifact_type, uri, sha256, size, source, acquisition_method,
                 collector, collected_at, created_at, received_at, timezone, tool_name,
                 tool_version, command_ref, analyst, purpose, sensitivity, retention_class,
                 integrity_status]
      properties:
        id: {type: string}
        case_id: {type: string}
        artifact_type: {type: string}
        uri: {type: string}
        sha256: {type: string}
        size: {type: integer}
        source: {type: string}
        acquisition_method: {type: string}
        collector: {type: string}
        collected_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        received_at: {type: string, format: date-time}
        timezone: {type: string}
        tool_name: {type: string}
        tool_version: {type: string}
        command_ref: {type: string}
        analyst: {type: string}
        purpose: {type: string}
        limitations: {type: array, items: {type: string}}
        derived_from: {type: array, items: {type: string}}
        sensitivity: {type: string, enum: [public, internal, confidential, restricted]}
        retention_class: {type: string}
        integrity_status: {type: string, enum: [verified, pending, mismatch, unavailable]}
        custody_events:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceCustodyEvent'
    ScheduleRequest:
      type: object
      required: [playbook_id, cron, enabled]
      properties:
        playbook_id: {type: string}
        cron: {type: string}
        timezone: {type: string, default: UTC}
        enabled: {type: boolean}
        input:
          type: object
          additionalProperties: true
    Schedule:
      allOf:
        - $ref: '#/components/schemas/ScheduleRequest'
        - type: object
          required: [id]
          properties:
            id: {type: string}
    EventIngestRequest:
      type: object
      required: [source, occurred_at, payload]
      properties:
        source:
          type: string
        occurred_at:
          type: string
          format: date-time
        payload:
          type: object
          additionalProperties: true
    AcceptedEvent:
      type: object
      required: [event_id, request_id, status]
      properties:
        event_id: {type: string}
        alert_id: {type: string}
        request_id: {type: string}
        status: {type: string, enum: [accepted, duplicate]}
    CreateCaseRequest:
      type: object
      required: [title, severity]
      properties:
        title: {type: string}
        category: {type: string}
        severity: {type: string, enum: [informational, low, medium, high, critical]}
        confidence: {type: number, minimum: 0, maximum: 1}
        alert_ids:
          type: array
          items: {type: string}
    Case:
      type: object
      required: [id, tenant_id, title, category, severity, confidence, status, opened_at, owner]
      properties:
        id: {type: string}
        tenant_id: {type: string}
        title: {type: string}
        category: {type: string}
        severity: {type: string}
        confidence: {type: number, minimum: 0, maximum: 1}
        status:
          type: string
          enum: [new, triage, investigating, contained, eradication, recovery, escalated, dismissed, closed]
        opened_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        closed_at: {type: string, format: date-time}
        owner: {type: string}
        incident_commander: {type: string}
        service_owner: {type: string}
        alert_refs: {type: array, items: {type: string}}
        observable_refs: {type: array, items: {type: string}}
        evidence_refs: {type: array, items: {type: string}}
        action_refs: {type: array, items: {type: string}}
        task_refs: {type: array, items: {type: string}}
        closure_reason: {type: string}
        hypothesis: {type: string}
        facts: {type: array, items: {type: string}}
        limitations: {type: array, items: {type: string}}
        correlation_key: {type: string}
        root_cause: {type: string}
        lessons_learned: {type: string}
        observables:
          type: array
          items:
            $ref: '#/components/schemas/CaseObservable'
        ticket_ref: {type: string}
        ticket_status: {type: string, enum: [open, closed]}
        pending_action:
          $ref: '#/components/schemas/Action'
    CaseObservable:
      type: object
      required: [type, value]
      properties:
        type: {type: string}
        value: {type: string}
        verdict: {type: string, enum: [malicious, suspicious, benign, unknown]}
        ti_confidence: {type: number, minimum: 0, maximum: 1}
        source_reliability: {type: string}
    StartExecutionRequest:
      type: object
      required: [playbook_id, case_id, mode]
      properties:
        playbook_id: {type: string}
        case_id: {type: string}
        mode: {type: string, enum: [dry_run, execute]}
        input:
          type: object
          additionalProperties: true
    ExecutionAccepted:
      type: object
      required: [execution_id, status]
      properties:
        execution_id: {type: string}
        status: {type: string, enum: [accepted, waiting_approval, running]}
    ReleaseAccepted:
      type: object
      required: [action_id, status]
      properties:
        action_id: {type: string}
        status: {type: string, enum: [released]}
    Execution:
      type: object
      required: [id, playbook_id, playbook_version, connector_version, policy_version, case_id, status, mode, started_at, steps]
      properties:
        id: {type: string}
        playbook_id: {type: string}
        playbook_version: {type: string}
        connector_version: {type: string}
        policy_version: {type: string}
        case_id: {type: string}
        status: {type: string}
        mode: {type: string, enum: [dry_run, execute]}
        started_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
        steps: {type: array, items: {type: object, additionalProperties: true}}
    TrustedSourceRequest:
      type: object
      required: [value, reason]
      properties:
        value: {type: string}
        reason: {type: string}
        expires_at: {type: string, format: date-time}
    TrustedSource:
      type: object
      required: [id, value, reason, created_by, created_at]
      properties:
        id: {type: string}
        value: {type: string}
        reason: {type: string}
        created_by: {type: string}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
    Approval:
      type: object
      required: [id, action_id, status, expires_at]
      properties:
        id: {type: string}
        action_id: {type: string}
        status: {type: string, enum: [pending, approved, rejected, expired]}
        approved_by: {type: string}
        reason: {type: string}
        decided_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
    Action:
      type: object
      required: [id, case_id, intent, target, risk, mode, status, requested_by, idempotency_key]
      properties:
        id: {type: string}
        case_id: {type: string}
        approval_id: {type: string}
        intent: {type: string}
        target:
          type: object
          required: [type, value]
          properties:
            type: {type: string}
            value: {type: string}
        risk: {type: string, enum: [low, medium, high, critical]}
        mode: {type: string, enum: [dry_run, execute]}
        status: {type: string, enum: [pending_approval, approved, rejected, expired, executed, released]}
        requested_by: {type: string}
        idempotency_key: {type: string}
        expires_at: {type: string, format: date-time}
        reason: {type: string}
    Problem:
      type: object
      required: [type, title, status, code, request_id, retryable]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        code: {type: string}
        request_id: {type: string}
        retryable: {type: boolean}
        detail: {type: string}
