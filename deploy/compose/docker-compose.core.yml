# M1 "core" profile: Postgres, the Go API, and the Next.js web app.
# docs/02-architecture/lab-deployment-profile.md explicitly sanctions
# starting with a bounded subset of the full lab stack ("core", "workflow",
# "security", "search", "observability" profiles) without changing the API
# contract. The "observability" profile (adr/0020) is implemented below;
# workflow/security/search remain commented placeholders, arriving with the
# milestones that actually need NATS/Temporal, Keycloak/Vault, and OpenSearch.

services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    profiles: ["core"]
    environment:
      POSTGRES_DB: soar
      POSTGRES_USER: soar
      POSTGRES_PASSWORD: soar_lab_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - soar_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soar -d soar"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    profiles: ["core"]
    build:
      context: ../../services/api
    environment:
      ADDR: ":8080"
      DATABASE_URL: postgres://soar:soar_lab_only@postgres:5432/soar?sslmode=disable
      DEFAULT_TENANT_ID: lab
      # Also written to a shared volume so promtail (observability profile,
      # adr/0020) can tail a plain file — harmless no-op when that profile
      # isn't running.
      LOG_FILE_PATH: /var/log/soar/api.jsonl
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - soar_api_logs:/var/log/soar
    depends_on:
      postgres:
        condition: service_healthy

  web:
    profiles: ["core"]
    build:
      context: ../../web
    environment:
      # Server-side only (fetched from Server Components, never the browser),
      # so this is the container network's api service name, not localhost.
      API_BASE_URL: http://api:8080
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

  # --- workflow profile (M3+: approval waits need durable orchestration) ---
  # nats: ...
  # temporal: ...

  # --- security profile (auth/secrets milestone) ---
  # keycloak: ...
  # vault: ...

  # --- search profile (derived-search milestone) ---
  # opensearch: ...

  # --- observability profile (adr/0020) ---
  prometheus:
    image: docker.io/prom/prometheus:v3.0.1
    profiles: ["observability"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
    ports:
      - "127.0.0.1:9090:9090"

  loki:
    image: docker.io/grafana/loki:3.3.2
    profiles: ["observability"]
    ports:
      - "127.0.0.1:3100:3100"

  promtail:
    image: docker.io/grafana/promtail:3.3.2
    profiles: ["observability"]
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro,Z
      - soar_api_logs:/var/log/soar:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  grafana:
    image: docker.io/grafana/grafana:11.4.0
    profiles: ["observability"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro,Z
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro,Z
    ports:
      - "127.0.0.1:3002:3000"
    depends_on:
      - prometheus
      - loki

  # otel-collector: deferred — no distributed call chain exists yet to trace
  # (Temporal/NATS aren't implemented); see adr/0020's Consequences.

volumes:
  soar_postgres_data:
  soar_api_logs:
