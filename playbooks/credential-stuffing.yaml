id: PB-AUTH-001
name: Credential stuffing and brute-force investigation
version: 1.0.0
owner: identity-response
type: investigation
status: draft
references:
  - https://sigmahq.io/sigma-specification/specification/sigma-correlation-rules-specification.html
  - https://csrc.nist.gov/pubs/sp/800/61/r3/final
trigger:
  source: siem_or_identity
  condition: repeated failures followed by success or distributed failures against an identity
scope:
  tenant: explicit
  users: correlated identities only
preconditions:
  - authentication events have UTC timestamps
  - source IP and target identity fields are mapped
steps:
  - id: correlate
    kind: investigate
    purpose: Group failures by user, source, device and time window.
    on_failure: create_manual_task
  - id: compare_baseline
    kind: enrich
    purpose: Compare normal user/device/location behavior.
    on_failure: record_unknown
  - id: inspect_success
    kind: investigate
    purpose: Inspect successful sign-in, MFA and session events after failures.
    on_failure: escalate
  - id: classify
    kind: decision
    purpose: Set confidence and distinguish password spray, brute force and false positive.
    on_failure: mark_inconclusive
  - id: contain
    kind: approval
    purpose: Request scoped token revocation or rate-limit action when compromise evidence exists.
    on_failure: stop
  - id: execute_containment
    kind: action
    purpose: Revoke the approved token or apply the approved rate-limit control using an idempotent identity/network action.
    on_failure: retry_then_manual
  - id: verify
    kind: verify
    purpose: Confirm no new suspicious session and attach query evidence.
    on_failure: escalate
evidence:
  - grouped authentication events and correlation window
  - successful-session and MFA references
  - confidence decision and scoped control approval
metrics:
  - correlation_precision
  - successful_compromise_detection_rate
  - false_positive_rate
safety:
  default_mode: dry_run
  approval_policy: no broad account disablement; privileged identities require incident commander approval
  stop_conditions:
    - source scope is unknown
    - identity is a shared/service account without owner confirmation
  rollback: restore only the exact scoped control after owner verification
tests:
  - distributed failures with no successful sign-in
  - failures followed by anomalous success
  - normal travel false positive
